[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storeops"
version = "0.1.0"
description = "StoreOps retail store operations API -- Cognizant AI-Native Tech Architect capstone reference app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
exclude = ["\\.venv", "build"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI's Depends()/Query() *must* be called in argument defaults --
# that is the dependency-injection mechanism itself, not a real bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
